  # ─── SEARCH ──────────────────────────────────────────────────────────────────
  /search:
    get:
      operationId: search
      tags: [search]
      summary: Global search
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string }
        - in: query
          name: type
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer }
        - in: query
          name: limit
          schema: { type: integer }
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResults"

  # ─── STAFF AUTH ───────────────────────────────────────────────────────────────
  /staff/login:
    post:
      operationId: staffLogin
      tags: [staff]
      summary: Staff login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffLoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffAuthResponse"
        "401":
          description: Unauthorized

  /staff/logout:
    post:
      operationId: staffLogout
      tags: [staff]
      summary: Staff logout
      responses:
        "204":
          description: Logged out

  /staff/me:
    get:
      operationId: getStaffMe
      tags: [staff]
      summary: Get current staff user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffUser"
        "401":
          description: Unauthorized

  /staff/users:
    get:
      operationId: listStaffUsers
      tags: [staff]
      summary: List staff users
      responses:
        "200":
          description: Staff users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffUser"
    post:
      operationId: createStaffUser
      tags: [staff]
      summary: Create staff user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffUserInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffUser"

  /staff/users/{id}:
    patch:
      operationId: updateStaffUser
      tags: [staff]
      summary: Update staff user
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffUserUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffUser"
    delete:
      operationId: deleteStaffUser
      tags: [staff]
      summary: Delete staff user
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  # ─── CONTENT APPROVAL ─────────────────────────────────────────────────────────
  /staff/pending:
    get:
      operationId: listPendingContent
      tags: [staff]
      summary: List content pending approval
      responses:
        "200":
          description: Pending content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingContentResponse"

  /staff/approve:
    post:
      operationId: approveContent
      tags: [staff]
      summary: Approve or reject content
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContentApprovalInput"
      responses:
        "200":
          description: Approval processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentApprovalResult"

  # ─── STATS ────────────────────────────────────────────────────────────────────
  /stats:
    get:
      operationId: getSiteStats
      tags: [stats]
      summary: Get site-wide statistics
      responses:
        "200":
          description: Statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteStats"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    # ─── NEWS ──────────────────────────────────────────────────────────────────
    NewsArticle:
      type: object
      required: [id, title, slug, content, status, createdAt, updatedAt]
      properties:
        id: { type: integer }
        title: { type: string }
        slug: { type: string }
        summary: { type: ["string", "null"] }
        content: { type: string }
        imageUrl: { type: ["string", "null"] }
        category: { type: ["string", "null"] }
        status: { type: string }
        featured: { type: boolean }
        authorId: { type: ["integer", "null"] }
        authorName: { type: ["string", "null"] }
        publishedAt: { type: ["string", "null"] }
        createdAt: { type: string }
        updatedAt: { type: string }

    NewsListResponse:
      type: object
      required: [items, total, page, limit]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/NewsArticle"
        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }

    NewsInput:
      type: object
      required: [title, content]
      properties:
        title: { type: string, minLength: 1 }
        slug: { type: string }
        summary: { type: string }
        content: { type: string }
        imageUrl: { type: string }
        category: { type: string }
        status: { type: string }
        featured: { type: boolean }
        publishedAt: { type: string }

    NewsUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        slug: { type: string }
        summary: { type: string }
        content: { type: string }
        imageUrl: { type: string }
        category: { type: string }
        status: { type: string }
        featured: { type: boolean }
        publishedAt: { type: string }

    # ─── PUBLICATIONS ──────────────────────────────────────────────────────────
    Publication:
      type: object
      required: [id, title, type, status, createdAt, updatedAt]
