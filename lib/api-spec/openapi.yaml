openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: OWC Website API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: news
    description: News and announcements
  - name: publications
    description: Publications
  - name: legislation
    description: Legislation
  - name: tenders
    description: Tenders
  - name: faqs
    description: FAQs
  - name: forms
    description: Forms and downloads
  - name: services
    description: Services
  - name: contact
    description: Contact
  - name: search
    description: Search
  - name: staff
    description: Staff CMS
  - name: stats
    description: Statistics and dashboard

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── NEWS ────────────────────────────────────────────────────────────────────
  /news:
    get:
      operationId: listNews
      tags: [news]
      summary: List news articles
      parameters:
        - in: query
          name: page
          schema: { type: integer }
        - in: query
          name: limit
          schema: { type: integer }
        - in: query
          name: category
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string }
      responses:
        "200":
          description: List of news
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsListResponse"
    post:
      operationId: createNews
      tags: [news]
      summary: Create news article
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewsInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsArticle"

  /news/featured:
    get:
      operationId: getFeaturedNews
      tags: [news]
      summary: Get featured news articles
      responses:
        "200":
          description: Featured news
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NewsArticle"

  /news/{id}:
    get:
      operationId: getNewsById
      tags: [news]
      summary: Get a news article
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: News article
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsArticle"
        "404":
          description: Not found
    patch:
      operationId: updateNews
      tags: [news]
      summary: Update a news article
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewsUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsArticle"
    delete:
      operationId: deleteNews
      tags: [news]
      summary: Delete a news article
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  # ─── PUBLICATIONS ─────────────────────────────────────────────────────────────
  /publications:
    get:
      operationId: listPublications
      tags: [publications]
      summary: List publications
      parameters:
        - in: query
          name: page
          schema: { type: integer }
        - in: query
          name: limit
          schema: { type: integer }
        - in: query
          name: type
          schema: { type: string }
        - in: query
          name: year
          schema: { type: integer }
        - in: query
          name: status
          schema: { type: string }
      responses:
        "200":
          description: List of publications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicationListResponse"
    post:
      operationId: createPublication
      tags: [publications]
      summary: Create publication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicationInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Publication"

  /publications/recent:
    get:
      operationId: getRecentPublications
      tags: [publications]
      summary: Get recent publications
      responses:
        "200":
          description: Recent publications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Publication"

  /publications/{id}:
    get:
      operationId: getPublicationById
      tags: [publications]
      summary: Get a publication
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Publication
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Publication"
        "404":
          description: Not found
    patch:
      operationId: updatePublication
      tags: [publications]
      summary: Update publication
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicationUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Publication"
    delete:
      operationId: deletePublication
      tags: [publications]
      summary: Delete publication
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  # ─── LEGISLATION ──────────────────────────────────────────────────────────────
  /legislation:
    get:
      operationId: listLegislation
      tags: [legislation]
      summary: List legislation
      parameters:
        - in: query
          name: page
          schema: { type: integer }
        - in: query
          name: limit
          schema: { type: integer }
        - in: query
          name: type
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string }
      responses:
        "200":
          description: List of legislation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegislationListResponse"
    post:
      operationId: createLegislation
      tags: [legislation]
      summary: Create legislation entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LegislationInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegislationItem"

  /legislation/{id}:
    get:
      operationId: getLegislationById
      tags: [legislation]
      summary: Get a legislation item
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Legislation item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegislationItem"
        "404":
          description: Not found
    patch:
      operationId: updateLegislation
      tags: [legislation]
      summary: Update legislation
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LegislationUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegislationItem"
    delete:
      operationId: deleteLegislation
      tags: [legislation]
      summary: Delete legislation
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  # ─── TENDERS ─────────────────────────────────────────────────────────────────
  /tenders:
    get:
      operationId: listTenders
      tags: [tenders]
      summary: List tenders
      parameters:
        - in: query
          name: page
          schema: { type: integer }
        - in: query
          name: limit
          schema: { type: integer }
        - in: query
          name: status
          schema: { type: string }
      responses:
        "200":
          description: List of tenders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenderListResponse"
    post:
      operationId: createTender
      tags: [tenders]
      summary: Create tender
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenderInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tender"

  /tenders/active:
    get:
      operationId: getActiveTenders
      tags: [tenders]
      summary: Get active tenders
      responses:
        "200":
          description: Active tenders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tender"

  /tenders/{id}:
    get:
      operationId: getTenderById
      tags: [tenders]
      summary: Get a tender
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Tender
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tender"
        "404":
          description: Not found
    patch:
      operationId: updateTender
      tags: [tenders]
      summary: Update tender
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenderUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tender"
    delete:
      operationId: deleteTender
      tags: [tenders]
      summary: Delete tender
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  # ─── FAQS ────────────────────────────────────────────────────────────────────
  /faqs:
    get:
      operationId: listFaqs
      tags: [faqs]
      summary: List FAQs
      parameters:
        - in: query
          name: category
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string }
      responses:
        "200":
          description: List of FAQs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Faq"
    post:
      operationId: createFaq
      tags: [faqs]
      summary: Create FAQ
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FaqInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Faq"

  /faqs/{id}:
    get:
      operationId: getFaqById
      tags: [faqs]
      summary: Get a FAQ
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: FAQ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Faq"
        "404":
          description: Not found
    patch:
      operationId: updateFaq
      tags: [faqs]
      summary: Update FAQ
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FaqUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Faq"
    delete:
      operationId: deleteFaq
      tags: [faqs]
      summary: Delete FAQ
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "204":
