name: CI/CD Pipeline

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

jobs:
  test:
    name: 🔍 Test
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: kt
          POSTGRES_DB: owc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: 📦 Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: 📊 Push database schema
        run: |
          cd lib/db
          pnpm drizzle-kit push
        env:
          DATABASE_URL: postgresql://postgres:kt@localhost:5432/owc_test

      - name: 🔍 TypeScript type check
        run: pnpm typecheck

      - name: 🧪 Run API tests
        run: |
          cd artifacts/api-server
          pnpm test
        env:
          DATABASE_URL: postgresql://postgres:kt@localhost:5432/owc_test
          PORT: 5178
          NODE_ENV: test
          JWT_SECRET: test-secret-key

      - name: 🏗️ Build
        run: pnpm build
        env:
          NODE_ENV: production